[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-sec-lint"
version = "0.3.0"
description = "Local security linting for OpenAPI and Swagger specifications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openapi", "swagger", "security", "lint", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn>=0.30,<1.0",
  "PyYAML>=6.0,<7.0",
  "psutil>=5.9,<8.0",
]

[project.urls]
Repository = "https://github.com/Kavin-arch/api-vulnerability-checker"
Documentation = "https://github.com/Kavin-arch/api-vulnerability-checker/tree/main/docs"
Issues = "https://github.com/Kavin-arch/api-vulnerability-checker/issues"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "hypothesis>=6.100,<7.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "types-PyYAML>=6.0,<7.0",
  "bandit>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
]

[project.scripts]
api-checker = "api_checker.cli:main"
openapi-sec-lint = "api_checker.cli:main"

[tool.setuptools.package-data]
api_checker = ["static/*", "examples/*"]

[tool.setuptools.packages.find]
include = ["api_checker*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["api_checker"]
ignore_missing_imports = true
