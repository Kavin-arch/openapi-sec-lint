openapi: 3.0.3
info:
  title: Example Store API
  version: 1.0.0
servers:
  - url: http://api.example.test/v1
paths:
  /customers/{customerId}:
    get:
      summary: Get customer details
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer record
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  access_token:
                    type: string
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku:
                        type: string
      responses:
        '201':
          description: Created
