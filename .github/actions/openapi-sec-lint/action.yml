name: OpenAPI Security Lint
description: Run OpenAPI Security Lint and optionally publish SARIF findings to code scanning.
inputs:
  spec:
    description: OpenAPI JSON/YAML file or directory to scan.
    required: false
    default: openapi.yaml
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install OpenAPI Security Lint
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH/../../.."
    - name: Scan specification
      shell: bash
      env:
        INPUT_SPEC: ${{ inputs.spec }}
      run: openapi-sec-lint scan "$INPUT_SPEC" --format sarif --output openapi-sec-lint.sarif
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: openapi-sec-lint.sarif
        category: openapi-sec-lint
