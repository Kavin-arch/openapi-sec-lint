name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openapi-sec-lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c 'import os, tomllib; tag=os.environ["TAG_NAME"].removeprefix("v"); version=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert tag == version, f"tag {tag} does not match package version {version}"'
        shell: bash
      - run: python -m pip install --upgrade build sigstore
      - run: python -m build
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: openapi-sec-lint.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign release artifacts and SBOM with Sigstore
        run: |
          mkdir -p signatures
          sigstore sign --output-directory signatures dist/* openapi-sec-lint.spdx.json
      - name: Create GitHub release and attach signed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* openapi-sec-lint.spdx.json signatures/*.sigstore.json --clobber
          else
            gh release create "$TAG_NAME" dist/* openapi-sec-lint.spdx.json signatures/*.sigstore.json --generate-notes --verify-tag
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ github.ref_name }}
          path: |
            dist/*
            openapi-sec-lint.spdx.json
            signatures/*.sigstore.json
          if-no-files-found: error
      - uses: pypa/gh-action-pypi-publish@release/v1
