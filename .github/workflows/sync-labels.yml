name: Sync issue labels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "good first issue", color: "7057ff", description: "A small, well-scoped task for a new contributor." },
              { name: "bug", color: "d73a4a", description: "Something is not working as expected." },
              { name: "enhancement", color: "a2eeef", description: "An improvement or new capability." },
              { name: "documentation", color: "0075ca", description: "Documentation improvements." },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({ ...context.repo, name: label.name, color: label.color, description: label.description });
              }
            }
