name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install uv
      - run: uv lock --check
      - run: python -m pip install -e ".[dev,web]"
      - run: ruff check api_checker tests
      - run: mypy api_checker
      - run: pytest --cov=api_checker --cov-report=term-missing --cov-fail-under=85
      - run: pip-audit
      - run: bandit -r api_checker
      - name: Dogfood the bundled sample
        run: |
          openapi-sec-lint scan api_checker/examples/sample-openapi.yaml --output sample-report.json
          python -c "import json; report=json.load(open('sample-report.json', encoding='utf-8')); assert report['status'] == 'completed' and report['summary']['operations'] > 0"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag openapi-sec-lint:ci .

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: openapi-sec-lint scan corpus/specs --output corpus-report.json
      - run: python scripts/verify_corpus.py corpus-report.json
      - run: openapi-sec-lint scan corpus/vulnerable --output vulnerable-report.json
      - run: python scripts/verify_vulnerable_corpus.py vulnerable-report.json
